# What a Fistroneer does in a subscription (homepage and /pricing/), shown
# in file order. Source: Fistron ADR 0068 point 2 (as amended 2026-10-27,
# 2026-10-29 and 2026-10-30) and ADR 0118: the setup in every tier, the
# days and the weekly hour from Business. No prices here.
- id: setup
  title: "Installs and sets Fistron up, in every tier"
  text: "In the deployment you chose, hosted, hybrid, on-premises or air-gapped: the agent and its access, your projects, policies, models and CI templates."
- id: capacity
  title: "Quality engineering days, without a new hire"
  text: "10 person-days a year in Business, 40 in Enterprise: test strategy, flaky and weak tests, test plans, compliance gaps, audit preparation. No recruiting, no onboarding of a new employee, no gap when someone leaves."
- id: weekly
  title: "One hour every week"
  text: "From Business, with your team: what changed, what is missing, what comes next, and the quarterly review with your leadership."
- id: grows
  title: "Grows with you"
  text: "In Enterprise also the ongoing work: upgrades, new projects and teams, new compliance frameworks, and on site where your contract says so."
