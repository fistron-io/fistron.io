# status: available | in-development
- id: pipeline-failure
  question: "Why did this pipeline fail?"
  answer: "Explain the failure from evidence across CI, source, cluster and endpoints, and acquire what the log doesn't show."
  status: available
- id: feature-evidence
  question: "What must this feature or fix demonstrate before we ship it?"
  answer: "Derive required checks from a change's intent and diff, with evidence references and explicit gaps."
  status: available
- id: test-coverage
  question: "Do our existing tests actually check what changed?"
  answer: "Inspect test assertions and results for the assessed revision. Report supported, failed or unverified checks, for human review."
  status: available
- id: test-plan
  question: "What is the test plan for this change?"
  answer: "Derive a reviewable plan from required evidence, existing tests and the checks still missing."
  status: available
- id: coverage-gap
  question: "Which changed lines does no test even execute?"
  answer: "Read diff and per-test coverage from your own tools (diff-cover, coverage.py, Cobertura, LCOV) and cite the uncovered lines as gaps. Covered is not tested: coverage never supports a check on its own."
  status: available
- id: necessary-work
  question: "Which work is necessary, and where should it run?"
  answer: "Select tests from required evidence and policy. Record a reason for every omitted test, preserve always-run checks and measure misses with periodic full runs."
  status: in-development
- id: suite-health
  question: "Which tests are flaky, and which ones add nothing?"
  answer: "Find flaky tests in your CI history and tests whose coverage another test already has, and propose them as a pull request you merge or reject. A test is recommended to merge or retire only when mutation results show nothing is lost. Both run in shadow mode today."
  status: in-development
- id: service-objective
  question: "Can we demonstrate this service's operating objective?"
  answer: "Coordinate the observations or recovery checks an agreed objective requires, for the agreed period."
  status: in-development
- id: release-decision
  question: "Can we explain the quality decision for this release?"
  answer: "Connect each requirement to its evidence, unresolved gaps and risk rationale, across tools."
  status: in-development
- id: measurable-quality
  question: "How do we improve quality across the company and measure it?"
  answer: "Propose goals, signals and metrics for review, as the KPIs you report or key results under your OKRs, then a Product Quality Index with traceable inputs, approved weights and visible gaps."
  status: in-development
- id: ai-code
  question: "How do we verify code written with AI before it ships?"
  answer: "Check every change against its intent and the evidence its risk requires: do the tests really check it, would they fail without it, are new dependencies real and approved. Stricter rules for AI-authored changes, a different model or plain rules as the verifier, and a signed report on the pull request."
  status: available
- id: compliance
  question: "Can we pass NIS2, EU DORA or ISO 27001 without months of manual evidence?"
  answer: "Monitor the controls from the tools you already run, close the gaps through them and prepare the audit; the certificate through an accredited partner."
  status: in-development
- id: cra
  question: "Are our releases ready for the Cyber Resilience Act?"
  answer: "Release evidence with the SBOM, recorded vulnerability handling, and root-cause analysis for the reports the act requires."
  status: in-development
- id: supplier
  question: "Did our supplier deliver what the contract requires?"
  answer: "Check each delivery against the evidence it must carry before acceptance, with an acceptance record."
  status: in-development
- id: status
  question: "Where do we stand, and what is still missing?"
  answer: "Fištrónek, Fistron's assistant, reports on request or every week: what is met, what is missing and why, what changed, the next steps. Every statement links to its evidence; missing data is named, never filled in."
  status: in-development
