# The tiers on /pricing/, shown in file order. Source: Fistron ADR 0118
# (pricing per active committer, 2026-10-30), ADR 0139 (the trial's limits
# and Individual, 2026-11-03), ADR 0140 (the models and the model pool,
# 2026-11-03) and business-model.md, its price list.
# Prices exclude VAT; each tier's minimum is a yearly price. Never invent a
# price here; scripts/check-plans.mjs compares them with the core's.
- id: trial
  name: "Trial"
  price: "Free"
  priceNote: "30 days"
  for: "For your team or organisation, to see the gap on your own code"
  features:
    - "Every feature, on one project or service"
    - "Readiness for one compliance framework: controls, state and gaps"
    - "Started on this website, without a call and without a card"
    - "Fistron Sovereign Rules — Deterministic, or the model you bring"
  note: "Coming: sign in with GitHub or GitLab, one trial per account and per repository. A pilot agreed with us lasts up to 60 days."
  cta: "Start your trial"
- id: individual
  name: "Individual"
  price: "EUR 15"
  priceNote: "a month, or EUR 144 a year; no commitment"
  for: "For one engineer, on your own machine"
  features:
    - "On your machine and in the CI of repositories you own"
    - "Fistron in your coding assistant: fistron mcp"
    - "Why your pull request or pipeline failed, and whether a test is flaky"
    - "Your branch reviewed before the pull request: missing evidence, uncovered changed lines, new dependencies"
    - "Your team's code review rules on your branch and in your coding assistant (in development)"
    - "Become a developer: your change explained to you before you submit it, line by line if you want (in development)"
    - "The test plan, coverage gaps and risk of your change; your feature's steps against the suite"
    - "A proposed test as a local patch, never pushed; a bad test's repair (in development)"
    - "Fistron Sovereign Rules — Deterministic, or your own model"
    - "With a model: EUR 29 a month or EUR 279 a year, a model credit of EUR 12 a month (Fistron Managed, in development)"
  note: "No control plane, team history, compliance or Fistroneer; help through the guide and e-mail. Paying by card is coming: until then, leave your details and we set you up."
  cta: "Get Individual"
- id: team
  name: "Team"
  price: "EUR 25"
  priceNote: "per active committer a month"
  minimum: "Minimum EUR 5,000 a year"
  for: "For a team that wants its failures explained and its tests in order"
  features:
    - "Hosted in the EU"
    - "Root cause analysis, flaky tests, test plans, coverage gaps, Suite Health, PR/MR review, change risk"
    - "Code review by Google's practices, your own rules, or both, on every pull or merge request (in development)"
    - "Become a developer: each engineer's changes explained privately to them, and the codebase to newcomers (in development)"
    - "Fast Feedback Loop: the loop measured"
    - "The repair of tests that work badly, and new tests for the test plan's gaps"
    - "Fistron Sovereign Rules — Deterministic, or your own model"
    - "A model pool of EUR 5 per active committer a month: Fistron Managed (in development), Fistron Sovereign LLM hosted in the EU (planned)"
    - "A Fistroneer who installs and sets Fistron up with you"
  cta: "Start with a free trial"
- id: business
  name: "Business"
  price: "EUR 45"
  priceNote: "per active committer a month"
  minimum: "Minimum EUR 20,000 a year"
  for: "For organisations that need the result, the people and the proof"
  features:
    - "Hosted in the EU or hybrid"
    - "Everything in Team"
    - "The control plane for your teams, and Fištrónek"
    - "Fast Feedback Loop: tiers, shift-left and the CI change proposed"
    - "One compliance framework in the tool"
    - "A model pool of EUR 8 per active committer a month; Fistron Sovereign LLM in your environment as an add-on (planned)"
    - "Outcomes as your KPIs, a quarterly review, signed attestations"
    - "Your repositories audited by your code review rules, and the trend (in development)"
    - "A Fistroneer who installs and sets up, then one hour every week and 10 person-days a year"
    - "Regulatory watch, audit-day support, RCA on call, training"
  cta: "Start with a free trial"
  featured: true
- id: enterprise
  name: "Enterprise"
  price: "EUR 65"
  priceNote: "per active committer a month"
  minimum: "Minimum EUR 80,000 a year"
  for: "For large organisations, many teams and closed networks"
  features:
    - "Everything in Business"
    - "Also on-premises and air-gapped"
    - "The compliance frameworks in your scope"
    - "40 Fistroneer person-days a year and the ongoing work: upgrades, new projects and teams, new frameworks"
    - "On site where your contract says so"
    - "A model pool of EUR 12 per active committer a month"
    - "Fistron Sovereign LLM in your environment, adapted on your data (planned)"
  cta: "Start with a free trial"
