# The tiers on /pricing/, shown in file order. Source: Fistron ADR 0118
# (pricing per active committer, 2026-10-30), ADR 0139 (the trial's limits
# and Individual, 2026-11-03), ADR 0140 (the models and the model pool,
# 2026-11-03), ADR 0152 (self-service, Team without a minimum, 2026-11-07)
# and business-model.md, its price list; ADR 0160 (new versions and fixes by plan,
# 2026-11-12).
# Prices exclude VAT; each tier's minimum is a yearly price. Never invent a
# price here; scripts/check-plans.mjs compares them with the core's.
- id: trial
  name: "Trial"
  price: "Free"
  priceNote: "30 days"
  for: "For your team or organisation, to see the gap on your own code"
  features:
    - "Every feature, on one project or service"
    - "Readiness for one compliance framework: controls, state and gaps"
    - "Started on this website, without a call and without a card"
    - "Fistron Sovereign Rules — Deterministic, or the model you bring"
  note: "Coming: sign in with GitHub or GitLab, one trial per account and per repository. A pilot agreed with us lasts up to 60 days."
  cta: "Start your trial"
- id: individual
  name: "Individual"
  price: "EUR 15"
  priceNote: "a month, or EUR 144 a year; no commitment"
  for: "For one engineer, on your own machine"
  features:
    - "On your machine, on any code, also your employer's; in the CI of repositories you own"
    - "Fistron in your coding assistant: fistron mcp"
    - "Why your pull request or pipeline failed, and whether a test is flaky"
    - "Your branch reviewed before the pull request: missing evidence, uncovered changed lines, new dependencies"
    - "Your team's code review rules on your branch and in your coding assistant"
    - "Become a developer: your change explained to you before you submit it, line by line if you want"
    - "Your review, your choice: the code explained, the AI review, your team's conventions, in any combination"
    - "The test plan, coverage gaps and risk of your change; your feature's steps against the suite"
    - "A proposed test as a local patch, never pushed; a bad test's repair"
    - "Manual verification from the command line: the evidence collected and checked by rules, the ticket's comment written"
    - "Fistron Sovereign Rules — Deterministic, or your own model"
    - "With a model: EUR 29 a month or EUR 279 a year, a model credit of EUR 12 a month (Fistron Managed, in development)"
    - "A personal history of your own runs and flaky tests, kept on your machine (in development)"
    - "Share an analysis or a review as a comment or a report, \"Analysed by Fistron\" beneath it unless you turn it off (in development)"
    - "Invite your team: a Team trial that starts with your history (in development)"
    - "Every new version and fix while your licence is valid; a fix in the newest version, one command away"
  note: "No team GUI, team history, compliance or Fistroneer; help through the guide and e-mail. Not for an organisation to buy for its people: they get the organisation's licence with Team. Paying by card is coming: until then, leave your details and we set you up."
  cta: "Get Individual"
- id: team
  name: "Team"
  price: "EUR 25"
  priceNote: "per active committer a month"
  minimum: "From 3 active committers, no minimum"
  for: "For a team that wants its failures explained and its tests in order"
  features:
    - "Hosted in the EU, or in your region on request; monthly or yearly"
    - "Fistron's GUI with your team's overviews and its shared history"
    - "Root cause analysis, flaky tests, test plans, coverage gaps, Suite Health, PR/MR review, change risk"
    - "Code review by Google's practices, your own rules, or both, on every pull or merge request"
    - "Become a developer: each engineer's changes explained privately to them, and the codebase to newcomers"
    - "Fast Feedback Loop: the loop measured"
    - "The repair of tests that work badly, and new tests for the test plan's gaps"
    - "Manual verification in the GUI, with checklist profiles shared in your organisation"
    - "Fistron Sovereign Rules — Deterministic, or your own model"
    - "A model pool of EUR 5 per active committer a month: Fistron Managed (in development), Fistron Sovereign LLM hosted in the EU (planned)"
    - "Every member's command line and every fork of your code under the team's licence"
    - "Your team's growth: what it should learn next, as a team, never a person's score (in development)"
    - "A Fistroneer who installs and sets Fistron up with you, from 10 active committers; for a smaller team by the day"
    - "Every new version and fix while your licence is valid; from Fistron 1.0, fixes in the previous minor version too"
  note: "Paying by card is coming: until then, leave your details and we set your team up."
  cta: "Buy Team"
- id: business
  name: "Business"
  price: "EUR 45"
  priceNote: "per active committer a month"
  minimum: "Minimum EUR 20,000 a year"
  for: "For organisations that need the result, the people and the proof"
  features:
    - "Everything in Team"
    - "Hosted in the EU or in your region, or hybrid"
    - "The control plane for your teams, and Fištrónek"
    - "Fast Feedback Loop: tiers, shift-left and the CI change proposed"
    - "One compliance framework in the tool"
    - "A model pool of EUR 8 per active committer a month; Fistron Sovereign LLM in your environment as an add-on (planned)"
    - "Outcomes as your KPIs, a quarterly review, signed attestations"
    - "Your repositories audited by your code review rules, and the trend"
    - "A Fistroneer who installs and sets up, then one hour every week and 10 person-days a year"
    - "Regulatory watch, audit-day support, RCA on call, training"
    - "From Fistron 1.0, security fixes in an older minor version for 12 months more"
  cta: "Start with a free trial"
  featured: true
- id: enterprise
  name: "Enterprise"
  price: "EUR 65"
  priceNote: "per active committer a month"
  minimum: "Minimum EUR 80,000 a year"
  for: "For large organisations, many teams and closed networks"
  features:
    - "Everything in Business"
    - "Also on-premises and air-gapped"
    - "The compliance frameworks in your scope"
    - "40 Fistroneer person-days a year and the ongoing work: upgrades, new projects and teams, new frameworks"
    - "On site where your contract says so"
    - "A model pool of EUR 12 per active committer a month"
    - "Fistron Sovereign LLM in your environment, adapted on your data (planned)"
    - "From Fistron 1.0, a long-term version each year with fixes for 24 months, and a fix backported on request"
  cta: "Start with a free trial"
