# Native CI support, separate from generic file-based evidence ingestion.
# A candidate is not an implemented integration or a promised delivery date.
- id: gitlab-ci
  name: "GitLab CI"
  logo: "gitlab"
  support: available
  label: "Available now"
  featured: true
  detail: "Import failed jobs, read merge requests and test reports, run Fistron in CI and optionally re-run a failed job under policy."
- id: github-actions
  name: "GitHub Actions"
  logo: "githubactions"
  support: candidate
  label: "Candidate · no adapter yet"
  featured: true
  detail: "A candidate for the next CI adapter. Integration scope and delivery order will follow pilot needs."
- id: jenkins
  name: "Jenkins"
  logo: "jenkins"
  support: limited
  label: "Limited · console logs only"
  featured: true
  detail: "Fistron can normalize supplied Jenkins console logs today. Live acquisition and Jenkins CI job integration are not implemented."
