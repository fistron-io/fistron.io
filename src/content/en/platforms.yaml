# Native CI support, separate from generic file-based evidence ingestion.
# A candidate is not an implemented integration or a promised delivery date.
- id: gitlab-ci
  name: "GitLab CI"
  logo: "gitlab"
  support: available
  label: "Available now"
  featured: true
  detail: "Import failed jobs, read merge requests and test reports, run Fistron in CI and optionally re-run a failed job under policy."
- id: github-actions
  name: "GitHub Actions"
  logo: "githubactions"
  support: available
  label: "Available now"
  featured: true
  detail: "Import failed jobs, read pull requests, job logs and JUnit artifacts, run Fistron in a workflow after a failed run and assess pull requests. Job re-runs are not implemented."
- id: jenkins
  name: "Jenkins"
  logo: "jenkins"
  support: limited
  label: "Limited · read-only, and CI changes"
  featured: true
  detail: "Read-only today, through the REST API or the Jenkins MCP Server plugin: the CI history with test reports and the case of a failed build. The test tiers' change of a declarative Jenkinsfile is proposed as a pull or merge request, checked by your Jenkins' own linter if you allow it. Running Fistron as a Jenkins job and re-running builds are not implemented."
