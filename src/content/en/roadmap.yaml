# State of 2026-10-12: V1, V1.5 and V2 exist (V1.5 and V2.5 in shadow mode);
# V3.1 and V3.2a exist, V3.2b (mutation results) and the pilots are under way;
# V4a (local UI) is being built. V4 comes before general availability; test
# authoring follows it as V5 (Fistron ADR 0054, 2026-10-11).
# status: implemented (filled checkbox), in-development (empty checkbox),
# planned (default, no checkbox).
- id: v1
  status: implemented
  stage: "V1 · Implemented; validating"
  title: "CI failed. Tell me why."
  detail: "Evidence-backed RCA, live reads, replay, CI reports and policy-controlled job re-runs. Broader real-case validation continues."
- id: v1-5
  status: implemented
  stage: "V1.5 · Implemented; shadow mode"
  title: "Flaky quarantine"
  detail: "Keep flaky tests outside the blocking path, still running and reported, with an owner until fixed or retired. Running weekly in shadow mode on Fistron's own CI history: candidates are proposed and quarantined tests are tracked; the pipeline is not changed yet."
- id: v2
  status: implemented
  stage: "V2 · Implemented; shadow mode"
  title: "From a change to the evidence it needs"
  detail: "Change assessment, test plans, extension points and the delivery baseline, reviewed by a person. Evidence selection runs in shadow mode on every pull request of Fistron's own repositories: it records what it would skip, and why, before anything is skipped."
- id: v3
  status: in-development
  stage: "V3 · Active development"
  title: "Coverage gaps and Suite Health"
  detail: "Implemented: changed lines no test executes, read from your coverage tools (V3.1), and the Suite Health audit, which runs weekly in shadow mode on Fistron's own suite (V3.2a). Now: mutation results, so tests can be recommended to merge or retire (V3.2b), and pilots on real pull requests."
  current: true
- id: v4a
  status: in-development
  stage: "V4a · Active development"
  title: "Your quality desk, on your machine"
  detail: "A local web interface over the same operations as the CLI, started with fistron ui. It already shows reports and records and starts runs. Next: approvals as pull or merge requests and a guided setup from install to the first assessment."
  current: true
- id: v4b
  stage: "V4b · Planned"
  title: "One control plane for your teams"
  detail: "The same interface for organisations: history across teams and projects, sign-in through your identity provider, roles and audit. On-premises, air-gapped, hybrid or as Fistron Cloud."
- id: ga
  stage: "GA · Planned"
  title: "General availability and open source"
  detail: "The first release offered for sale, together with the public open-source edition at fistron.org, once V3 and V4 meet their exit criteria. No date is committed."
- id: v5
  stage: "V5 · After GA"
  title: "Author the missing tests"
  detail: "Create missing tests with your existing tools and review workflows."
- id: v6
  stage: "V6 · After GA"
  title: "Predictive quality"
  detail: "Use accumulated evidence to anticipate quality risks."
- id: v7
  stage: "V7 · After GA"
  title: "Closed-loop quality engineering"
  detail: "Coordinate quality objectives, evidence, gap closure and reassessment across tools."
