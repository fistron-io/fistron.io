# State of 2026-10-23 (Fistron docs/design/roadmap.md): V1 to V3 exist (V1.5,
# V2.5 and the Suite Health audit in shadow mode; pilots continue); V3.5 (the
# suite map and the plan of the missing tests, ADR 0078) runs on an
# open-source project's acceptance suite; V4a is released and being
# validated; V4b runs in production (app.fistron.io) for its first pilot;
# V4.5, V4.6 and V6a are implemented and being validated; V7a (repair of bad
# tests, ADR 0073) is implemented and its exit runs on Fistron's own
# repositories. Since 2026-10-22: V5 (authoring new tests, ADR 0082) is in
# development and comes before general availability, and V4.6c (the guide
# that acts, ADR 0083) is a condition of it. V7.5, Distributed Continuous
# Certification (ADR 0080), right after V7a.
# status: implemented (filled checkbox), in-development (empty checkbox),
# planned (default, no checkbox). The list is shown in this order.
- id: v1
  status: implemented
  stage: "V1 · Implemented; validating"
  title: "CI failed. Tell me why."
  detail: "Evidence-backed RCA, live reads, replay, CI reports and policy-controlled job re-runs. Broader real-case validation continues."
- id: v1-5
  status: implemented
  stage: "V1.5 · Implemented; shadow mode"
  title: "Flaky quarantine"
  detail: "Keep flaky tests outside the blocking path, still running and reported, with an owner until fixed or retired. Running weekly in shadow mode on Fistron's own CI history: candidates are proposed and quarantined tests are tracked; the pipeline is not changed yet."
- id: v2
  status: implemented
  stage: "V2 · Implemented; shadow mode"
  title: "From a change to the evidence it needs"
  detail: "Change assessment, test plans, extension points and the delivery baseline, reviewed by a person. Evidence selection runs in shadow mode on every pull request of Fistron's own repositories: it records what it would skip, and why, before anything is skipped."
- id: v3
  status: implemented
  stage: "V3 · Implemented; validating"
  title: "Coverage gaps, Suite Health and AI-written changes"
  detail: "Changed lines no test executes, from your coverage tools (V3.1). The Suite Health audit, which recommends retiring a test only when mutation results show nothing is lost (V3.2). An evidence gate for AI-written changes, with velocity in the delivery baseline (V3.3). In shadow mode and pilots on Fistron's own repositories."
- id: v3-5
  status: implemented
  stage: "V3.5 · Implemented; validating"
  title: "Your suite against your product"
  detail: "Which of your product's functions the test suite reaches: the pages of its documentation, the methods of its API, the platforms it supports, linked to the scenarios that test them, with what CI ran. What is missing becomes a plan of the missing tests by priority. Being validated on an open-source project's acceptance suite."
- id: v4a
  status: implemented
  stage: "V4a · Implemented; validating"
  title: "Your quality desk, on your machine"
  detail: "A local web interface over the same operations as the CLI, started with fistron ui: reports and records, runs, approvals as pull or merge requests and a guided setup from install to the first assessment. Now: first installs by people new to Fistron."
- id: v4b
  status: implemented
  stage: "V4b · Implemented; validating"
  title: "One control plane for your teams"
  detail: "The same interface for organisations: history across teams and projects, sign-in through your identity provider, roles and audit, with agents inside your network that connect outbound only. On-premises, air-gapped, hybrid or as Fistron Cloud. In production on Fistron Cloud for its first pilot; the remaining exit checks continue."
- id: v4-5
  status: implemented
  stage: "V4.5 · Implemented; validating"
  title: "Compliance, done for you"
  detail: "Readiness (V4.5a): framework profiles, first ISO 27001 mapped to NIS2, each control's state with its evidence or the reason, monitored continuously; recorded on Fistron's own repositories. The audit (V4.5b): remediation through your tools, management approvals, findings, the signed audit package, auditor access and Fistron's attestation. The certificate comes from an accredited partner."
- id: v4-6
  status: implemented
  stage: "V4.6 · Implemented; validating"
  title: "Fištrónek, your assistant"
  detail: "Recommendations, guided scope and status reports on request or every week, each statement linked to its evidence; measurable outcomes as KPIs and key results with baselines, targets and the quarterly review. Works without AI; with a model, a conversation that cites what it read, and the same tools as an MCP server for your own assistant. In development (V4.6c): a guide on every page of the interface that shows what the page needs next and, after you confirm, does it as you."
- id: v5
  status: in-development
  stage: "V5 · Active development"
  title: "Author new tests"
  detail: "Fistron writes the tests your plan says are missing, from your suite's own steps first, generating only what no step provides and labelling it, and proposes each as a pull or merge request a person merges. A test is accepted only when it runs, is stable and measurably meets its plan item. First for Gherkin suites (V5a), then tests in your own tools for infrastructure changes (V5b)."
  current: true
- id: v6
  status: in-development
  stage: "V6 · Change risk in shadow mode"
  title: "Predictive quality"
  detail: "The risk of each change before it is merged, with its factors and the missing data named, in shadow mode and never blocking (V6a). Next: predictions checked against what really happened after the merge (V6b). From your own data only; nothing learned or compared across customers."
- id: v7
  status: in-development
  stage: "V7 · Repair implemented; validating"
  title: "A closed loop on your tests"
  detail: "Fistron finds the tests that work badly (weak, flaky, slow without contribution), proves it, proposes the repair as a pull or merge request, runs it on your CI and checks the result (V7a, implemented; validated on Fistron's own repositories). For what no test covers, a test plan your people write against (V7b)."
- id: v7-5
  stage: "V7.5 · Planned"
  title: "Distributed Continuous Certification"
  detail: "For vendors of on-premises software: your key customers receive pre-release builds, Fistron's agent installs and tests them in their staging environments with your suite and their checks, and each run ends with a signed attestation. What is shared with you is agreed per programme; you certify the release for their environment."
- id: ga
  stage: "GA · After V7 and V5"
  title: "General availability"
  detail: "The first release offered for sale, once V3 to V4.6 (with the guide), V5, V6 and V7 meet their exit criteria. No date is committed."
