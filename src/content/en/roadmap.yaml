# State of 2026-10-18 (Fistron docs/design/roadmap.md): V1 to V3 exist (V1.5,
# V2.5 and the Suite Health audit in shadow mode; pilots continue); V4a is
# released and being validated; V4b runs on Fistron's staging; V4.5
# (compliance, ADR 0061 and 0067), V4.6 (Fištrónek with measurable outcomes,
# ADR 0066, 0068 and 0069) and V6a (change risk, ADR 0072) are implemented
# and being validated; V7a (repair of bad tests, ADR 0073) is in
# development. Order since 2026-10-17 (ADR 0071): V4.6, V6, V7, then general
# availability (ADR 0060); V5 (authoring new tests) after it. V7.5,
# Distributed Continuous Certification (ADR 0075, proposed 2026-10-21),
# right after V7a.
# status: implemented (filled checkbox), in-development (empty checkbox),
# planned (default, no checkbox).
- id: v1
  status: implemented
  stage: "V1 · Implemented; validating"
  title: "CI failed. Tell me why."
  detail: "Evidence-backed RCA, live reads, replay, CI reports and policy-controlled job re-runs. Broader real-case validation continues."
- id: v1-5
  status: implemented
  stage: "V1.5 · Implemented; shadow mode"
  title: "Flaky quarantine"
  detail: "Keep flaky tests outside the blocking path, still running and reported, with an owner until fixed or retired. Running weekly in shadow mode on Fistron's own CI history: candidates are proposed and quarantined tests are tracked; the pipeline is not changed yet."
- id: v2
  status: implemented
  stage: "V2 · Implemented; shadow mode"
  title: "From a change to the evidence it needs"
  detail: "Change assessment, test plans, extension points and the delivery baseline, reviewed by a person. Evidence selection runs in shadow mode on every pull request of Fistron's own repositories: it records what it would skip, and why, before anything is skipped."
- id: v3
  status: implemented
  stage: "V3 · Implemented; validating"
  title: "Coverage gaps, Suite Health and AI-written changes"
  detail: "Changed lines no test executes, from your coverage tools (V3.1). The Suite Health audit, which recommends retiring a test only when mutation results show nothing is lost (V3.2). An evidence gate for AI-written changes, with velocity in the delivery baseline (V3.3). In shadow mode and pilots on Fistron's own repositories."
- id: v4a
  status: implemented
  stage: "V4a · Implemented; validating"
  title: "Your quality desk, on your machine"
  detail: "A local web interface over the same operations as the CLI, started with fistron ui: reports and records, runs, approvals as pull or merge requests and a guided setup from install to the first assessment. Now: first installs by people new to Fistron."
- id: v4b
  status: in-development
  stage: "V4b · Running on staging"
  title: "One control plane for your teams"
  detail: "The same interface for organisations: history across teams and projects, sign-in through your identity provider, roles and audit. On-premises, air-gapped, hybrid or as Fistron Cloud. Running on Fistron's staging; the remaining exit checks run alongside V4.5."
- id: v4-5
  status: implemented
  stage: "V4.5 · Implemented; validating"
  title: "Compliance, done for you"
  detail: "Readiness (V4.5a): framework profiles, first ISO 27001 mapped to NIS2, each control's state with its evidence or the reason, monitored continuously; recorded on Fistron's own repositories. The audit (V4.5b): remediation through your tools, management approvals, findings, the signed audit package, auditor access and Fistron's attestation. The certificate comes from an accredited partner."
- id: v4-6
  status: implemented
  stage: "V4.6 · Implemented; validating"
  title: "Fištrónek, your assistant"
  detail: "Recommendations, guided scope and status reports on request or every week, each statement linked to its evidence; measurable outcomes as KPIs and key results with baselines, targets and the quarterly review. Works without AI; with a model, a conversation that cites what it read, and the same tools as an MCP server for your own assistant."
- id: v6
  status: in-development
  stage: "V6 · Change risk in shadow mode"
  title: "Predictive quality"
  detail: "The risk of each change before it is merged, with its factors and the missing data named, in shadow mode and never blocking (V6a). Next: predictions checked against what really happened after the merge (V6b). From your own data only; nothing learned or compared across customers."
- id: v7
  status: in-development
  stage: "V7 · Active development"
  title: "A closed loop on your tests"
  detail: "Fistron finds the tests that work badly (weak, flaky, slow without contribution), proves it, proposes the repair as a pull or merge request, runs it on your CI and checks the result (V7a). For what no test covers, a test plan your people write against (V7b)."
  current: true
- id: v7-5
  stage: "V7.5 · Planned"
  title: "Distributed Continuous Certification"
  detail: "For vendors of on-premises software: your key customers receive pre-release builds, Fistron's agent installs and tests them in their staging environments with your suite and their checks, and each run ends with a signed attestation. What is shared with you is agreed per programme; you certify the release for their environment."
- id: ga
  stage: "GA · After V7"
  title: "General availability"
  detail: "The first release offered for sale, once V3 to V4.6, V6 and V7 meet their exit criteria. No date is committed."
- id: v5
  stage: "V5 · After GA"
  title: "Author new tests"
  detail: "Create new tests with your existing tools and review workflows."
