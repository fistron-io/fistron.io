# State of 2026-10-29 (Fistron docs/design/roadmap.md). V1 to V4.6 are
# implemented and being validated (V1.5, V2.5 and the Suite Health audit in
# shadow mode; V4b in production for its first pilot). V3.6 (the engineer's
# loop, ADR 0115) and V3.2c (the value of end-to-end tests, ADR 0113) are
# implemented, their synthetic exits recorded. V5a, V6a, V6b, V7a and V7b
# are implemented and being validated; V5b is next. V7.5a and V7.5b are
# implemented (the dogfood programme next); V7.5c (the release gate, ADR
# 0114) is in development, steps 2 and 3 done. V7.6a's benchmark is
# implemented, the prompts and the candidates' runs are in development;
# V7.6b is planned. V7.7 (Migration Assurance, ADR 0107 and 0109) a, b and c
# are implemented, their synthetic exits recorded, the dogfood next; V7.7 is
# a condition of GA since 2026-10-28. Base models are not named on the site.
# status: implemented (filled checkbox, green), in-development (empty
# checkbox), planned (default, no checkbox). parts: the stage's milestones,
# each with its own status; an implemented one is green. The list is shown
# in this order.
- id: v1
  status: implemented
  stage: "V1 · Implemented; validating"
  title: "CI failed. Tell me why."
  detail: "Evidence-backed RCA, live reads, replay, CI reports and policy-controlled job re-runs. Broader real-case validation continues."
- id: v1-5
  status: implemented
  stage: "V1.5 · Implemented; shadow mode"
  title: "Flaky quarantine"
  detail: "Keep flaky tests outside the blocking path, still running and reported, with an owner until fixed or retired. Running weekly in shadow mode on Fistron's own CI history: candidates are proposed and quarantined tests are tracked; the pipeline is not changed yet."
- id: v2
  status: implemented
  stage: "V2 · Implemented; shadow mode"
  title: "From a change to the evidence it needs"
  detail: "Change assessment, test plans, extension points and the delivery baseline, reviewed by a person. Evidence selection runs in shadow mode on every pull request of Fistron's own repositories: it records what it would skip, and why, before anything is skipped."
- id: v3
  status: implemented
  stage: "V3 · Implemented; validating"
  title: "Coverage gaps, Suite Health and AI-written changes"
  detail: "Changed lines no test executes, from your coverage tools. The Suite Health audit, which recommends retiring a test only when mutation results show nothing is lost, and for end-to-end suites without coverage the scenarios that repeat another's steps, check nothing, are slow without a function of their own or never detected a product failure. An evidence gate for AI-written changes, with velocity in the delivery baseline. In shadow mode and pilots on Fistron's own repositories."
  parts:
    - label: "V3.1"
      text: "Coverage gaps from your coverage tools"
      status: implemented
    - label: "V3.2"
      text: "The Suite Health audit, in shadow mode"
      status: implemented
    - label: "V3.2c"
      text: "The value of end-to-end tests; next: a public end-to-end suite in shadow mode"
      status: implemented
    - label: "V3.3"
      text: "The evidence gate for AI-written changes"
      status: implemented
- id: v3-5
  status: implemented
  stage: "V3.5 · Implemented; validating"
  title: "Your suite against your product"
  detail: "Which of your product's functions the test suite reaches: the pages of its documentation, the methods of its API, the platforms it supports, linked to the scenarios that test them, with what CI ran. What is missing becomes a plan of the missing tests by priority. Being validated on an open-source project's acceptance suite."
- id: v3-6
  status: implemented
  stage: "V3.6 · Implemented; validating"
  title: "Fistron in your coding assistant"
  detail: "Your coding assistant asks Fistron while you work, through MCP or a plugin: a review of your branch against the suite (a step without its definition, a feature in no run set, a check that asserts nothing, a fixed sleep), with your repository's own rules as the review's rubric; which tests your change is missing; a test proposed for an item of the plan; a pull request reviewed on your project's agent. Around it: your issue tracker in the daily CI review, and a benchmark that gates every change of a prompt or a model."
- id: v4a
  status: implemented
  stage: "V4a · Implemented; validating"
  title: "Your quality desk, on your machine"
  detail: "A local web interface over the same operations as the CLI, started with fistron ui: reports and records, runs, approvals as pull or merge requests and a guided setup from install to the first assessment. Now: first installs by people new to Fistron."
- id: v4b
  status: implemented
  stage: "V4b · Implemented; validating"
  title: "One control plane for your teams"
  detail: "The same interface for organisations: history across teams and projects, sign-in through your identity provider, roles and audit, with agents inside your network that connect outbound only. On-premises, air-gapped, hybrid or as Fistron Cloud. In production on Fistron Cloud for its first pilot; the remaining exit checks continue."
- id: v4-5
  status: implemented
  stage: "V4.5 · Implemented; validating"
  title: "Compliance, done for you"
  detail: "Readiness (V4.5a): framework profiles, first ISO 27001 mapped to NIS2, each control's state with its evidence or the reason, monitored continuously; recorded on Fistron's own repositories. The audit (V4.5b): remediation through your tools, management approvals, findings, the signed audit package, auditor access and Fistron's attestation. The certificate comes from an accredited partner."
  parts:
    - label: "V4.5a"
      text: "Readiness: framework profiles and each control's state with its evidence"
      status: implemented
    - label: "V4.5b"
      text: "The audit: remediation, approvals, findings, the signed audit package, auditor access"
      status: implemented
- id: v4-6
  status: implemented
  stage: "V4.6 · Implemented; validating"
  title: "Fištrónek, your assistant"
  detail: "Recommendations, guided scope and status reports on request or every week, each statement linked to its evidence; measurable outcomes as KPIs and key results with baselines, targets and the quarterly review. Works without AI; with a model, a conversation that cites what it read, and the same tools as an MCP server for your own assistant. A guide on every page of the interface (V4.6c) shows what the page needs next, does it as you after you confirm, and answers how-to questions from the guide; implemented, its onboarding measurement continues."
  parts:
    - label: "V4.6a"
      text: "Guidance, status reports and measurable outcomes, without AI"
      status: implemented
    - label: "V4.6b"
      text: "The conversation, and the same tools as an MCP server"
      status: implemented
    - label: "V4.6c"
      text: "The guide on every page that acts as you after you confirm"
      status: implemented
- id: v5
  status: in-development
  stage: "V5 · V5a implemented; V5b next"
  title: "Author new tests"
  detail: "Fistron writes the tests your plan says are missing, from your suite's own steps first, generating only what no step provides and labelling it, and proposes each as a pull or merge request a person merges. A test is accepted only when it runs, is stable and measurably meets its plan item; reviewers' comments on the request are answered with a checked revision."
  parts:
    - label: "V5a"
      text: "Tests from your suite's own building blocks: Gherkin scenarios and unit tests"
      status: implemented
    - label: "V5b"
      text: "Tests in your own tools for infrastructure changes"
      status: planned
- id: v6
  status: implemented
  stage: "V6 · Implemented; validating"
  title: "Predictive quality"
  detail: "The risk of each change before it is merged, with its factors and the missing data named, in shadow mode and never blocking. Each prediction checked against what really happened in the weeks after the merge (reverts, fixes of the same code, escaped defects from your issue trackers), and its accuracy measured against a plain size-of-change baseline, claimed only when there are enough outcomes and it does better. From your own data only; nothing learned or compared across customers."
  parts:
    - label: "V6a"
      text: "The risk of each change, in shadow mode"
      status: implemented
    - label: "V6b"
      text: "Predictions checked against outcomes, their accuracy measured"
      status: implemented
- id: v7
  status: implemented
  stage: "V7 · Implemented; validating"
  title: "A closed loop on your tests"
  detail: "Fistron finds the tests that work badly (weak, flaky, slow without contribution), proves it, proposes the repair as a pull or merge request, runs it on your CI and checks the result. For what no test covers: new kinds of gaps in the same Test plan, from the checks a change could not support, the changed lines no test executes and the risk factors no test guards, each closed when a later run shows it met."
  parts:
    - label: "V7a"
      text: "The repair of bad tests, validated on Fistron's own repositories"
      status: implemented
    - label: "V7b"
      text: "The plan for what no test covers"
      status: implemented
- id: v7-5
  status: in-development
  stage: "V7.5 · Release gate in development"
  current: true
  title: "Distributed Continuous Certification"
  detail: "For vendors of on-premises software: your key customers receive pre-release builds, Fistron's agent installs and tests them in their staging environments with your suite and their checks, and each run ends with a signed attestation. What is shared with you is agreed per programme; you see each release by environment, with the regressions test by test, and certify the release for their environment. Your release pipeline waits for the release gate: the environments and upgrade paths a build must pass before it ships."
  parts:
    - label: "V7.5a"
      text: "Validation in a customer's environment: the kit with five runners, verified builds, staging-only targets, attestations, export for air-gapped sites"
      status: implemented
    - label: "V7.5b"
      text: "Programmes across customers and releases in the control plane"
      status: implemented
    - label: "V7.5c"
      text: "The release gate, with upgrades from earlier releases"
      status: in-development
- id: v7-6
  status: in-development
  stage: "V7.6 · Benchmark implemented; in development"
  title: "Fistron Sovereign"
  detail: "Choose how Fistron decides. Fistron Sovereign Rules — Deterministic: no LLM, every decision comes from rules and evidence. Fistron Sovereign LLM — Performance and Fistron Sovereign LLM — Traceable: Fistron's own model, the second on a base whose training data is documented, for audit. One general model, and your own adaptation trained on your data in your environment, also air-gapped, used only when it does better on your own benchmark. A benchmark across rules, commercial models and open-weight models decides the model: each candidate runs the same tasks three times through the same pipeline, on cases from your own runs, and the report shows what it solves beyond rules, what changes between runs and what it costs. All variants keep Fistron's deterministic evidence and gates; the LLM variants add model reasoning on top."
  parts:
    - label: "V7.6a"
      text: "The benchmark, implemented; the prompts and the candidates' runs in development"
      status: in-development
    - label: "V7.6b"
      text: "The training pipeline and your own adaptation"
      status: planned
- id: v7-7
  status: implemented
  stage: "V7.7 · Implemented; validating"
  title: "Migration Assurance"
  detail: "Before a server moves from virtual machines or bare metal to containers, Kubernetes or a cloud: what must survive recorded read-only (services, ports, certificates, scheduled jobs, packages, configuration, the counts of what the product manages) and the required behaviour derived from it; the migration rehearsed in staging and compared before and after; the restore of the backup proven before the cutover; the cutover verified, also on production by reading only, with a signed attestation. For vendors, the matrix of supported migration paths: covered, failing or without evidence, those without evidence scheduled through your tools. Next: a real RPM-to-container migration of an open-source product, rehearsed and attested."
  parts:
    - label: "V7.7a"
      text: "The inventory and the required behaviour"
      status: implemented
    - label: "V7.7b"
      text: "The rehearsal, the verified restore and the cutover"
      status: implemented
    - label: "V7.7c"
      text: "The vendor's matrix of migration paths"
      status: implemented
- id: ga
  stage: "GA · After V7, V5 and V7.7"
  title: "General availability"
  detail: "The first release offered for sale, once V3 to V4.6 (with the guide), V5, V6, V7 and V7.7 meet their exit criteria. No date is committed."
