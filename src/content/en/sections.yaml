  intro: "Every subscription comes with a Fistroneer: a named quality engineer from Fistron who sets Fistron up with you and then works on your quality as part of your team. For about the yearly cost of one senior QE engineer, you get the platform, a Fistroneer and outcomes reviewed every quarter, without recruiting, onboarding and keeping one more specialist."
  note: "Person-days and on-site work as your subscription and contract say."
  linkLabel: "See pricing"

sovereign:
  title: "Fistron Sovereign: choose how Fistron decides"
  intro: "Deterministic rules with no AI at all, or Fistron's own model, running in your network and trained on your data if you want. All variants keep Fistron's deterministic evidence and gates; the LLM variants add model reasoning on top."
  note: "Fistron's own models are planned (stage V7.6); a benchmark of rules, commercial and open-weight models on cases from your own runs works today and decides which base serves you best."
  linkLabel: "Sovereignty in detail"

pricingPage:
  title: "Pricing"
  intro: "A subscription includes the platform and the people: a Fistroneer who sets Fistron up and works on your quality, outcomes reviewed every quarter, and the proof your auditors accept."
