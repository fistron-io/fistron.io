# Headings and short copy for each homepage section, keyed by section.
# Lists (questions, integrations, ...) are in their own files next to this one.

hero:
  title: "Prove your quality. Keep your tools. Get your time back."
  intro: "A Quality Control Plane for software products, infrastructure and IT services. Start with evidence-backed CI failure analysis. Build towards quality decisions across the tools you already run."
  primaryCta: "Request a demo"
  secondaryCta: "See how it works"
  caption: "Target workflow with example data. In development."

problem:
  title: "Your tools each answer their own question. Nobody answers yours."
  intro: "CI knows whether a job passed. The test manager knows which tests exist. Observability knows what happened in production. Whether a change, a release or a service actually meets its quality objective is still assembled by hand, across tools and teams."
  note: "Your pipeline is green. Your release manager is not."
  caption: "Passed on retry. Again. Fištrónek has questions."

how:
  title: "From desired quality to verified evidence"
  intro: "Don't replace anything. Orchestrate everything. The target workflow compares the quality you need with the evidence you have, then coordinates your tools to close the gap."
  note: "The loop runs within your budget and permissions. It ends when the objective is supported, or with an explicit list of what remains open and why."

questions:
  title: "Questions Fistron is built to answer"
  intro: "CI failure analysis, change assessment, test plans and coverage gaps work today. Change assessments still need human review: a cited test assertion can be real without proving the whole requirement. Broader validation is ongoing."

outcomes:
  title: "Quality, schedule and cost. Without trading one for another."
  intro: "Every project is run against three baselines, and more quality usually costs time or money. Fistron doesn't break that triangle. It removes the waste inside it: tests that add no evidence, flaky reruns, failures waiting for the right person, test plans assembled by hand."
  paragraphs:
    - "Fewer tests, same evidence. Every test that doesn't run for a change has a recorded reason. Flaky tests are quarantined, not deleted. The full suite still runs on a schedule, to catch what selection would have missed."
    - "A saving counts only if quality holds. Fistron records your baseline first, and reports change failure rate and escaped defects next to every saving."
  note: "Test plans and the delivery baseline work today. Evidence selection, flaky quarantine and the Suite Health audit run in shadow mode on Fistron's own repositories: they record what they would do, nothing is skipped, quarantined or removed yet. No savings figures yet; pilots must measure them against quality guardrails."
  quip: "Tests that add no evidence. Out."

ci:
  title: "Start where it hurts: CI failed. Tell me why."
  paragraphs:
    - "The first Fistron workflow explains failed pipelines from evidence, not guesses. When the cause isn't in the log, Fistron names the missing evidence and acquires it read-only from GitLab, GitHub, Kubernetes or the failing endpoint."
    - "Run it locally, in GitLab CI or in GitHub Actions after a failure, collecting evidence before environment cleanup. Keep the assessment as JSON, Markdown or HTML, with recordings you can replay offline."
    - "Delegate deeper investigation to HolmesGPT, or enable a policy-controlled re-run of a failed GitLab job. Re-runs are disabled by default. If the evidence isn't enough, Fistron says so."
    - "V1 is implemented and broader validation on real failures is ongoing. Change assessment and test plans are available too: derive required checks, inspect test assertions, results and coverage, report failures or evidence gaps and plan the tests to run. Evidence selection runs in shadow mode."
  caption: "Shortened output from a synthetic example case."

trust:
  title: "Conclusions you can check"
  intro: "Fistron uses AI where it helps, never as the source of truth. Every claim points back to evidence you can open."
  caption: "An evidence item"

platforms:
  title: "Your CI. One quality control plane."
  intro: "Fistron is built around evidence, so teams can keep their CI platforms. GitLab CI and GitHub Actions are the implemented adapters. Here is exactly what works today and what is being considered next."
  note: "GitLab CI and GitHub Actions have native CI adapters today; re-running a failed job works on GitLab only. A full Jenkins adapter and Azure DevOps are the likely next candidates; pilot needs determine the order."
  linkLabel: "Explore more platform candidates"
  caption: "These platforms are listed in the roadmap for evaluation. No native adapters or delivery dates are committed. Descriptions show the intended evidence sources."
  paragraphs:
    - "Already have the artifacts? Fistron can analyse supplied CI logs, diffs and JUnit files without a native platform adapter. This does not include automatic collection, CI setup or job re-runs on those platforms."
    - "Using more than one CI? Tell us which workflow needs evidence first."
  primaryCta: "Discuss your platform"
  quip: "Your CI plays. Fištrónek conducts."

integrations:
  title: "Evidence beyond the pipeline"
  intro: "Integrations are capabilities: each one declares what it can observe, investigate, execute or author. You decide which are switched on."

governance:
  title: "Quality you can demonstrate, not just claim"
  caption: "Approved. With the evidence attached."

deployment:
  title: "Runs where your evidence lives"
  intro: "Run the CLI or CI job inside your environment. Choose an approved model endpoint, a local model or deterministic rules; the endpoint you configure determines where evidence is sent."
  note: "Today: local CLI, CI job mode in GitLab CI and GitHub Actions from a signed image, record/replay and a local Linux Compose profile for HolmesGPT. Offline analysis uses existing evidence with rules or a local model."
  caption: "The local interface is being built (V4a); the control plane for teams follows (V4b)."

roadmap:
  title: "Where Fistron is heading"
  intro: "V1, V1.5 and V2 work today, with flaky quarantine and evidence selection in shadow mode on Fistron's own repositories. Coverage gaps and the Suite Health audit (V3) are implemented and in their pilots; the local interface (V4a) is being built alongside. The control plane for teams (V4b) comes before general availability; later stages remain planned. Human review and broader validation continue."
  caption: "V7 looks promising. V3 and V4a first."

openCore:
  title: "Start with one project. Grow across teams."
  intro: "The proposed open-source edition includes the CLI, Evidence Model, connectors, evidence-backed analysis, coverage gaps and the local interface, usable independently of the commercial core. It is planned to be published with general availability."
  paragraphs:
    - "The planned commercial core adds evidence selection, flaky quarantine, Suite Health and history, with a bundled free licence for limited scope and a paid licence for organisation-wide use."
    - "Cross-team orchestration, PQI and governance are planned for organisations. Packaging, licences, scope limits and pricing are not final; these editions are not released yet."
  linkLabel: "Visit fistron.org"

about:
  title: "Why Fistron"
  intro: "Fištrón (Czech, say fish-trone) is the knack of knowing how to get things done: wit applied to a real problem. Fistron doesn't run everything. It works out what your quality objective actually needs, and gets it done with the tools you already have."
  paragraphs:
    - "Meet Fištrónek, our crow. Crows are among the cleverest animals: they use whatever tools are around them. He hands over the checkbox only once the evidence is in."

demo:
  title: "See Fistron on your toolchain"
  intro: "Tell us about a quality decision that takes too much manual work today. We'll show you what Fistron finds, and what it would need."
  primaryCta: "Request a demo"
  note: "Demo requests aren't connected yet. This form doesn't send anything."
  faxLabel: "Fax number"
  faxJoke: "Just kidding :-)"
  successLabel: "Request received"
  successTitle: "Evidence: 1. Confidence: high."
  successText: "Thanks, we'll get back to you soon. Fištrónek is already reading it."
  errorText: "That didn't go through. Please try again in a moment."

notFound:
  title: "This page went flaky."
  intro: "It was here on the last run. Fištrónek is chasing it down. In the meantime, the homepage passes every time."
  primaryCta: "Back to the homepage"
