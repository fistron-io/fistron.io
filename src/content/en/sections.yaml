# Headings and short copy for each homepage section, keyed by section.
# Lists (questions, integrations, ...) are in their own files next to this one.

hero:
  eyebrow: "Assured, not assumed."
  title: "The end-to-end autonomous assurance platform"
  intro: "Fistron is the autonomous orchestration of quality and compliance: with the tools you already run, it delivers the quality your customers, auditors and regulators expect, end to end and under your control, and the proof they accept. Prove your quality, keep your tools and get your time back."
  note: "CI failure analysis, change assessment, test plans, coverage gaps and the checks for code written with AI work today; the rest is in development. People and guarantees are set per contract."
  primaryCta: "Request a demo"
  secondaryCta: "See how it works"
  caption: "Target workflow with example data. In development."

problem:
  title: "Your tools each answer their own question. Nobody answers yours."
  intro: "CI knows whether a job passed. The test manager knows which tests exist. Observability knows what happened in production. Whether a change, a release or a service actually meets its quality objective is still assembled by hand, across tools and teams."
  note: "Your pipeline is green. Your release manager is not."
  caption: "Passed on retry. Again. Fištrónek has questions."

whyNow:
  title: "Why now"
  intro: "Regulation turned proof of quality and security into a purchasing requirement, AI made code faster to write and harder to trust, and engineers spend most of their week keeping things running."
  note: "Third-party surveys, most of them sponsored by vendors; figures are shown as published, with their source. Fistron's own results will be published when pilots have measured them."

how:
  title: "From desired quality to verified evidence"
  intro: "Don't replace anything. Orchestrate everything. The target workflow compares the quality you need with the evidence you have, then coordinates your tools to close the gap."
  note: "The loop runs within your budget and permissions. It ends when the objective is supported, or with an explicit list of what remains open and why."

questions:
  title: "Questions Fistron is built to answer"
  quip: "Quarantined, not deleted. Still running, still reported."
  intro: "CI failure analysis, change assessment, test plans, coverage gaps and the checks for AI-written changes work today. Change assessments still need human review: a cited test assertion can be real without proving the whole requirement. Broader validation is ongoing."

outcomes:
  title: "Quality, schedule and cost. Without trading one for another."
  intro: "Every project is run against three baselines, and more quality usually costs time or money. Fistron doesn't break that triangle. It removes the waste inside it: tests that add no evidence, flaky reruns, failures waiting for the right person, test plans assembled by hand."
  paragraphs:
    - "Fewer tests, same evidence. Every test that doesn't run for a change has a recorded reason. Flaky tests are quarantined, not deleted. The full suite still runs on a schedule, to catch what selection would have missed."
    - "A saving counts only if quality holds. Fistron records your baseline first, and reports change failure rate and escaped defects next to every saving."
    - "Time taken back goes to what your customers pay for. Velocity is measured, never promised: lead time, deployment frequency and the share of merged changes that are new work, from your own CI and repository data. Never story points."
  note: "Test plans and the delivery baseline, velocity included, work today. Evidence selection, flaky quarantine and the Suite Health audit run in shadow mode on Fistron's own repositories: they record what they would do, nothing is skipped, quarantined or removed yet. No savings figures yet; pilots must measure them against quality guardrails."
  quip: "Tests that add no evidence. Out."

offer:
  title: "We deliver the solution, not just a tool"
  intro: "Fistron's people design and deliver it with the Fistron platform. You approve; we do the work, with your permission at every step."
  paragraphs:
    - "Need a certificate? One package delivers the complete QA solution with the certification you need: Fistron sets up the processes, tests and evidence and obtains the certificate for you through an accredited partner."
    - "The partner audits independently and decides; Fistron prepares everything and coordinates the process. Without a certificate you get the same solution with Fistron's signed reports."
    - "Between the weekly sessions with your architect, Fištrónek, Fistron's assistant, guides setup and scope and sends a weekly status report."
  caption: "What we commit to"
  note: "Offered from the first pilots; terms are set per contract. Compliance in the tool and the certification path are in development."

included:
  title: "Included in every subscription"
  intro: "You pay for people and for results we stand behind, not for a licence. No premium add-ons."

ci:
  title: "Start where it hurts: CI failed. Tell me why."
  paragraphs:
    - "The first Fistron workflow explains failed pipelines from evidence, not guesses. When the cause isn't in the log, Fistron names the missing evidence and acquires it read-only from GitLab, GitHub, Kubernetes or the failing endpoint."
    - "Run it locally, in GitLab CI or in GitHub Actions after a failure, collecting evidence before environment cleanup. Keep the assessment as JSON, Markdown or HTML, with recordings you can replay offline."
    - "Delegate deeper investigation to HolmesGPT, or enable a policy-controlled re-run of a failed GitLab job. Re-runs are disabled by default. If the evidence isn't enough, Fistron says so."
    - "V1 is implemented and broader validation on real failures is ongoing. Change assessment and test plans are available too: derive required checks, inspect test assertions, results and coverage, report failures or evidence gaps and plan the tests to run. Evidence selection runs in shadow mode."
  caption: "Shortened output from a synthetic example case."

trust:
  title: "Conclusions you can check"
  intro: "Fistron uses AI where it helps, never as the source of truth. Every claim points back to evidence you can open."
  caption: "An evidence item"

dogfood:
  title: "We test Fistron with Fistron"
  intro: "Fistron and its closed core are built on GitHub Actions, and Fistron watches its own CI before it watches yours. All of it runs in shadow mode: Fistron records what it would do, and a person decides."
  quip: "Chef's rule: taste it before you serve it."
  paragraphs:
    - "In a controlled test, a pull request promised “no change in behaviour”. Fistron read the diff and the failing test instead, and named the change."
  note: "Measured on Fistron's own repository on 11 October 2026. Changes there are made and reviewed by the same developer, so this shows the mechanics, not independent validation."

platforms:
  title: "Your CI. One quality control plane."
  intro: "Fistron is built around evidence, so teams can keep their CI platforms. GitLab CI and GitHub Actions are the implemented adapters. Here is exactly what works today and what is being considered next."
  note: "GitLab CI and GitHub Actions have native CI adapters today; re-running a failed job works on GitLab only. A full Jenkins adapter and Azure DevOps are the likely next candidates; pilot needs determine the order."
  linkLabel: "Explore more platform candidates"
  caption: "These platforms are listed in the roadmap for evaluation. No native adapters or delivery dates are committed. Descriptions show the intended evidence sources."
  paragraphs:
    - "Already have the artifacts? Fistron can analyse supplied CI logs, diffs and JUnit files without a native platform adapter. This does not include automatic collection, CI setup or job re-runs on those platforms."
    - "Using more than one CI? Tell us which workflow needs evidence first."
  primaryCta: "Discuss your platform"
  quip: "Your CI plays. Fištrónek conducts."

integrations:
  title: "Evidence beyond the pipeline"
  intro: "Integrations are capabilities: each one declares what it can observe, investigate, execute or author. You decide which are switched on."

governance:
  title: "Compliance and quality you can demonstrate"
  intro: "For NIS2, EU DORA and ISO 27001, Fistron monitors the controls from your own tools, fixes what it can through them and prepares the audit. You approve; your management stays accountable."
  caption: "Approved. With the evidence attached."

deployment:
  title: "Runs where your evidence lives"
  intro: "Run the CLI or CI job inside your environment. AI is optional: Fistron works on deterministic rules without any model, or with a local model or an approved endpoint. The endpoint you configure determines where evidence is sent."
  note: "Today: local CLI and web interface, CI job mode in GitLab CI and GitHub Actions from a signed image, record/replay and a local Linux Compose profile for HolmesGPT. Offline analysis uses existing evidence with rules or a local model."
  caption: "The local interface is implemented (V4a); the control plane for teams (V4b) runs on Fistron's staging."
  quip: "127.0.0.1:8740. Fištrónek's favourite address."

partners:
  title: "Run a platform? Offer quality to your customers"
  intro: "PaaS and SaaS providers can offer Fistron inside their own services. Your customers get quality and compliance where they already deploy and pay, built on the evidence your platform already holds."
  paragraphs:
    - "Each customer gets its own tenant, in the region you promise, with nothing shared across customers. Your customers sign in from your console; usage records feed your billing."
    - "Fistron's services (solution packages, certification through a partner, the weekly architect hour) are available to your customers too, directly or through you."
  primaryCta: "Become a platform partner"
  note: "Planned with the control plane for teams (V4b). We build the first integration together with the first partner; commercial terms are agreed per partner."

roadmap:
  title: "Where Fistron is heading"
  intro: "V1 to V3 work today, with flaky quarantine, evidence selection and the Suite Health audit in shadow mode on Fistron's own repositories; the local interface and setup (V4a) are released and being validated. The control plane for teams (V4b) runs on Fistron's staging, and compliance in the tool (V4.5) is in development. The Fištrónek assistant (V4.6), test authoring (V5), predictive quality (V6) and the closed loop (V7) follow; general availability comes after them. Human review and broader validation continue."
  caption: "V7 looks promising. Compliance first."

openCore:
  title: "Start with one project. Grow across teams."
  intro: "Start with a readiness assessment of one project or service: where you stand on quality and, if relevant, compliance, and what closing the gaps would take."
  paragraphs:
    - "A time-limited trial licence lets a pilot try Fistron's commercial core (evidence selection, flaky quarantine, Suite Health and history) on a limited scope; for compliance it shows the gaps but does not close them. A paid licence opens it organisation-wide, with cross-team orchestration, PQI and governance."
    - "Packaging, licences, scope limits and pricing are not final, and these editions are not released yet. Fistron is not published as open source for now."
  linkLabel: "Request a readiness assessment"

about:
  title: "Why Fistron"
  intro: "Fištrón (Czech, say fish-trone) is the knack of knowing how to get things done: wit applied to a real problem. Fistron doesn't run everything. It works out what your quality objective actually needs, and gets it done with the tools you already have."
  paragraphs:
    - "Meet Fištrónek, our crow. Crows are among the cleverest animals: they use whatever tools are around them. He hands over the checkbox only once the evidence is in."

demo:
  title: "See Fistron on your toolchain"
  intro: "Tell us about a quality decision or an audit that takes too much manual work today. We'll show you what Fistron finds and what it would need, starting with a readiness assessment of one project or service."
  primaryCta: "Request a demo"
  note: "Demo requests aren't connected yet. This form doesn't send anything."
  faxLabel: "Fax number"
  faxJoke: "Just kidding :-)"
  successLabel: "Request received"
  successTitle: "Evidence: 1. Confidence: high."
  successText: "Thanks, we'll get back to you soon. Fištrónek is already reading it."
  errorText: "That didn't go through. Please try again in a moment."

notFound:
  title: "This page went flaky."
  intro: "It was here on the last run. Fištrónek is chasing it down. In the meantime, the homepage passes every time."
  primaryCta: "Back to the homepage"
