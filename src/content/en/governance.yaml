# Shown as "In development" as a whole section.
- id: controls
  title: "Controls monitored from your tools"
  text: "Framework profiles for ISO 27001 mapped to NIS2, then EU DORA, ISO 22301, ISO/IEC 20000-1, TMMi and the Cyber Resilience Act. Always visible: which controls are met, which are not, and why."
- id: remediation
  title: "Gaps closed, not just listed"
  text: "Fistron fixes what it can through your tools, as pull or merge requests you approve, and proposes the rest; our people do what a tool cannot."
- id: audit
  title: "The audit, prepared"
  text: "An evidence package and read-only access for the auditor, findings with owners and deadlines, and a signed attestation. The certificate comes from an independent accredited partner."
- id: audits
  title: "Automated quality audits"
  text: "Check continuously whether requirements, tests, results and policies still support your quality claims."
- id: policies
  title: "Quality-based policies"
  text: "Versioned policies with owners, exceptions and expiry, applied to the right scope."
- id: review
  title: "Internal quality review"
  text: "Record an accountable acceptance for a defined scope and evidence snapshot, and reassess it when things change."
- id: reports
  title: "Reports others can verify"
  text: "Scoped reports with versioned metrics and traceable evidence, including failures, gaps and accepted risk."
- id: metrics
  title: "Goals, signals and measurable quality"
  text: "Propose metrics from your objectives, for human review. Compare a baseline with later evidence; missing data remains visible."
- id: pqi
  title: "A quality index you can explain"
  text: "Trace the Product Quality Index to versioned metrics and approved weights. Show critical guardrail breaches even when the overall score rises."
