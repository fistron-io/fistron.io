# The solutions Fistron offers, shown in file order: a card on the homepage
# and on /solutions/, and a page of its own at /solutions/<id>/.
# Source: Fistron docs/design/value-proposition.md ("Customer problems Fistron
# solves", "The offer"), go-to-market.md ("Positioning", "Messages by
# audience") and target-audiences.md; state of 2026-11-06.
#
# status: available when the solution's core works in the Fistron
# repository today, also while it is being validated (decided with the
# founder 2026-10-29); everything else is in-development. A service of
# Fistron's people (end-to-end, without-headcount) is available once it is
# offered with the platform (decided 2026-11-06). `stage` says exactly what
# works, what is being validated and what is planned.
# group: the column of the Solutions menu (labels in src/config/site.ts).
# questions: ids from questions.yaml, shown with their own status.
- id: end-to-end
  title: "End-to-end quality solution"
  for: "For organisations that want the result, not one more tool"
  group: quality
  short: "Fistron's people design, deliver and run the solution to your quality problem with the Fistron platform, and prove it with evidence. The certificate, if you need one, through an accredited partner."
  status: available
  stage: "Available now: offered with the platform, starting with the first pilots; people and guarantees are set per contract. The platform parts the solution uses have their own state, on the pages of the solutions and in the roadmap."
  problem: "Most organisations don't want to buy a quality tool and build the solution themselves. They want a solved problem: someone who designs it for their software or service, runs it, and hands them proof they can show to management, customers, auditors and regulators."
  gets:
    - "Assess: a baseline of your quality, delivery and compliance from your own tools, and the gaps against the standard or policy you need."
    - "Design: quality policies, the evidence each change and service requires, the test and check strategy, the controls an auditor will look for."
    - "Deliver: Fistron set up in your toolchain, the missing capabilities enabled, the gaps closed through pull or merge requests you approve."
    - "Operate and prove: continuous assessment, signed reports per change and release, and preparation for external audits."
    - "A Fistroneer, a named quality engineer from Fistron, who installs and sets Fistron up with you and works on your quality: from Business, 10 or 40 person-days a year and one hour every week, instead of one more hire."
    - "Outcomes agreed as your KPIs and key results, and a quarterly review against the baseline."
  questions: [deadline, status, measurable-quality, release-decision]
  related: [offer, open-core]
- id: quality-improvement
  title: "Quality improvement"
  for: "For engineering, QE and platform teams"
  group: quality
  short: "Explain failed pipelines from evidence, plan the tests a change needs, find what no test covers, quarantine flaky tests and repair the tests that work badly, with the tools you already run."
  status: available
  stage: "CI failure analysis, change assessment, test plans and coverage gaps work today. Flaky quarantine, evidence selection and the Suite Health audit run in shadow mode; the repair of bad tests, the risk of each change with its measured accuracy, the value of end-to-end tests, Gherkin and unit tests written for your plan and tests in your own tools for infrastructure changes are implemented and being validated. A quality audit of a project shows where to start. An analysis may also read evidence from your own MCP servers (a product, monitoring, ticketing), through the tools you allow that only read."
  problem: "Red pipelines nobody can explain, flaky re-runs, test plans assembled by hand, thousands of tests run for a one-line change, and suites full of tests that check nothing. Each tool answers its own question; nobody answers whether the change is good enough."
  gets:
    - "Why a pipeline failed, from evidence across CI, source, cluster and endpoints; what is missing is acquired read-only or named."
    - "The evidence a change requires, the existing tests that support it, and a test plan for what is still missing."
    - "Changed lines no test executes, from your own coverage tools, and your suite mapped against your product's functions."
    - "Flaky tests out of the blocking path with an owner; tests that add no evidence recommended for retirement only when nothing is lost."
    - "Weak, flaky and slow tests found with proof, repaired as a pull or merge request, run on your CI and checked."
    - "The risk of a change before it is merged, with its factors and the data that is missing; never blocking."
    - "A quality audit of your tests and CI from what you already have: a plan ordered by what costs your team most, and what the audit needs to say more."
  questions: [pipeline-failure, feature-evidence, test-coverage, test-plan, coverage-gap, necessary-work, suite-health, test-repair, change-risk]
  related: [ci, outcomes]
- id: fast-feedback-loop
  title: "Fast Feedback Loop"
  for: "For teams whose full suite runs for hours"
  group: quality
  short: "Know within minutes, not tomorrow. Fistron measures how long your team waits for a test result, proposes test tiers from your own CI history, shows which slow end-to-end tests can move left and proposes the change of your CI configuration. Your CI runs the tiers; your team decides who owns each."
  status: available
  stage: "Implemented and being validated (V3.7): the loop measured from your CI history, the tiers proposed with their reasons, the selection within a tier in shadow mode, the change of your GitHub Actions, GitLab or Jenkins configuration proposed and validated, and the history replayed under the tiers as an estimate. No speed-up is claimed until your own CI runs the tiers. Next: a public end-to-end suite measured, its tiers reviewed by people who know it."
  problem: "The product is big, the components many, the full suite runs for twelve hours. A change pushed today shows its result tomorrow, the developer has moved on, and every failure costs a day. Some tests are slow because they test the API through the user interface; others run on every change though they add nothing."
  gets:
    - "Your feedback loop measured from your CI history: time to the first result and to the first failure, the baseline and the trend."
    - "Test tiers proposed with the reason for every test: fast checks on every push, the tests a change needs on every pull or merge request, the full suite at night, release validation."
    - "The tiers' owners set by your team: developers, developers and QE, or QE, in a policy reviewed like code."
    - "Slow end-to-end tests that only check the API proposed as API tests, and tests that add nothing moved out of the fast tiers, only with proof."
    - "Within a tier, the tests most likely to fail run first."
    - "Once you approve the tiers, the change of your CI configuration proposed as a pull or merge request for GitHub Actions, GitLab or Jenkins; you review and merge it, your CI runs it. No new pipeline tool."
    - "Failures that slipped to a later tier recorded, so the tiers improve with evidence."
  questions: [feedback-loop, suite-health, necessary-work]
  related: [ci, outcomes]
- id: ai-written-code
  title: "Verifying code written with AI"
  for: "For teams that merge code written by assistants and agents"
  group: quality
  short: "An evidence gate on every change, whoever wrote it: does it do what was asked, do the tests really check it, would they fail without it, are its new dependencies real."
  status: available
  stage: "The checks of a change and the evidence gate on pull requests work today; stricter rules for AI-authored changes are set by policy. Broader validation continues."
  problem: "A large share of committed code is now written with AI, and most developers don't fully trust it. A model that writes both the code and its tests can make both wrong in the same way, and changes often do more than was asked."
  gets:
    - "The change compared with its stated intent: unexplained parts of the diff are a finding."
    - "The evidence the change requires by risk, and whether existing tests and their results support it."
    - "Tests that would not fail without the change, and tests written by the same model, called out."
    - "New dependencies checked to exist and to be approved, with your security scanners' results as evidence."
    - "A different verifier than the author: another model, or Fistron Sovereign Rules — Deterministic, with no model at all."
    - "The result on the pull request, blocking by policy, kept as a signed report."
    - "AI-written changes reviewed in the same review against your team's rules, stricter by policy."
  questions: [ai-code, test-coverage, feature-evidence]
  related: [trust]
  see: [code-review-rules, become-a-developer]
- id: become-a-developer
  title: "Become a developer"
  for: "For engineers who write code with assistants, and the teams they join"
  group: quality
  short: "Own your code. Understand every change before you submit it, even when AI wrote it. Fistron explains what your change does, what it affects and what really tests it, and teaches you your team's rules, privately to you."
  status: available
  stage: "Implemented and being validated: your change explained from evidence (what it does and why, what it affects, what really tests it), Line by line, the check of your understanding with the confirmation your team may require, your private learning path and any module explained for newcomers; in your coding assistant, the CLI, the local UI and the control plane. Its synthetic exit is recorded; next: the changes of a real team."
  problem: "You are responsible for what you push, also when an assistant wrote it. Code that works but that nobody on the team understands becomes the next incident, the next reviewer cannot ask the assistant why, and the knowledge of the code leaves with the model instead of staying with people."
  gets:
    - "What your change does, per file and function, and why: tied to what you were asked to do, with unexplained parts highlighted."
    - "What it affects: callers, side effects, changed behaviour, configuration and dependencies, from evidence."
    - "What really tests it: the tests that execute your changed lines, and the lines no test checks."
    - "Line by line: switch on a deeper mode that explains the lines in detail, the language and the project's own helpers."
    - "A private learning path: what to learn next, from what you keep needing explained. Only you see it."
    - "New in the team? Any module or service explained the same way, so you are productive sooner."
    - "An optional check of your understanding before you submit; your team may require the confirmation, your answers stay yours."
    - "Private to you, in your coding assistant, the CLI and Fistron's GUI: it reaches your pull or merge request only if you publish it."
  questions: [become-a-developer, ai-code]
  related: [trust]
  see: [developer-assistant, ai-written-code, code-review-rules]
- id: compliance
  title: "End-to-end solution for NIS2, EU DORA and ISO 27001"
  for: "For security, compliance and risk leaders"
  group: compliance
  short: "The controls monitored from the tools your teams already use, the gaps closed through them, the audit package prepared, and the certificate through an accredited partner."
  status: available
  stage: "Readiness and the audit (remediation, approvals, findings, the signed audit package, auditor access, Fistron's attestation) are implemented and being validated on Fistron's own repositories, first for ISO 27001 mapped to NIS2 Article 21. EU DORA, ISO 22301, ISO/IEC 20000-1, TMMi and the Cyber Resilience Act follow."
  problem: "NIS2 and EU DORA turned proof of security and quality into a purchasing requirement. Evidence is assembled by hand before every audit, and few organisations in scope are confident they comply."
  gets:
    - "Framework profiles: the controls a framework needs and the evidence that shows each, first ISO 27001 for development and change, mapped to NIS2 Article 21."
    - "Each control's state at any time, with its evidence or the reason it is not met."
    - "Remediation, not only findings: what the tool can fix as pull or merge requests you approve, the rest assigned to Fistron's people."
    - "Management approvals, findings with owners and deadlines, and the signed audit package with read-only auditor access."
    - "Certification by an independent accredited partner, prepared and coordinated by Fistron; the partner decides."
  questions: [compliance, status]
  related: [governance]
- id: continuous-certification
  title: "Distributed Continuous Certification"
  for: "For vendors of on-premises software"
  group: certification
  short: "Your key customers validate your pre-release builds in their own staging environments, with your test suite and their checks. Each run ends with a signed attestation; what they share with you is agreed."
  status: available
  stage: "Implemented and being validated (V7.5a to V7.5c): the validation kit with its five runners (script, container, Ansible playbook, Testkube, openQA), the build's digest and signature verified before anything is installed, staging-only targets, the run, its attestation and the sharing with export for air-gapped sites; programmes across customers in the control plane, builds published from your CI, results received and your view of each release by environment, with the regressions test by test; the release gate your release pipeline waits for, with the upgrades from earlier releases a build must pass (V7.5c). Next: the first programme on production."
  problem: "On-premises software meets operating systems, networks, proxies, scale and air-gapped sites its vendor's lab never reproduces. Releases then fail only at customers, upgrades slow down, and customers must test every change before production anyway."
  gets:
    - "Your release installed and tested before general availability, in the environments you cannot reproduce: problems found where they would appear."
    - "Your installer and suite run as you define them: a script, a container, an Ansible playbook, a Testkube test or an openQA job."
    - "Never in production: the agent installs only in targets the customer marks as staging or isolated, and only builds whose digest and signature verify."
    - "A signed attestation per run, release and environment, verifiable offline by anyone with the installation's public key."
    - "Sharing agreed per programme and customer: by default the result, the versions and a test summary; logs and details only if both agree, every item in a ledger; air-gapped sites export a file."
    - "A programme you offer your key customers: certified for your environment, before you upgrade. The certification is yours, not an accredited certificate."
  questions: [pre-ga]
  related: []
- id: developer-assistant
  title: "Fistron for your coding assistant"
  for: "For developers who work with a coding assistant"
  group: quality
  short: "Your coding assistant asks Fistron while you work: why your pull request failed, what your branch still needs, whether your feature's steps exist, a test for an item of the plan. Answers cite their evidence."
  status: available
  stage: "Implemented and being validated (V3.6): Fistron's tools in any coding assistant that speaks MCP, with a plugin for coding assistants: the root cause of your pull request, a review of your branch against the suite with your repository's own rules as its rubric, the steps of your feature checked, the tests your change is missing, a test proposed for a plan item, and a pull request reviewed on your project's agent. Fistron's MCP server over a project's reports and records works today."
  problem: "Developers ask their coding assistant why CI failed or whether a change is tested, and the assistant answers from what it can see in the editor. The CI history, the test suite's map, the project's rules and the evidence are somewhere else, so the answer is a plausible guess."
  gets:
    - "The root cause of your pull request's failure, from the CI run's evidence, inside your assistant."
    - "A review of your branch before you open the pull request: the evidence the change needs, what is missing, tests that don't check what changed."
    - "Your feature's steps checked against the suite: undefined or ambiguous steps, a feature outside every run set, a step without an assertion."
    - "A test proposed for an item of the plan, as a change you review, never pushed for you."
    - "Your team's review rules given to the assistant before it writes, and its branch reviewed before the pull request."
    - "The same tools for any assistant that speaks MCP; answers cite the reports they come from, and your data classes and model policy apply."
  questions: [dev-assistant, ai-code]
  related: [trust]
  see: [become-a-developer, code-review-rules]
- id: measurable-quality
  title: "Measurable quality and velocity"
  for: "For leaders who must show the return"
  group: quality
  short: "Quality, schedule and cost baselines from your own tools, outcomes agreed as your KPIs and key results, and velocity measured against guardrails, never promised."
  status: available
  stage: "The delivery baseline, velocity included, works today. Outcomes as KPIs and key results and Fištrónek's status reports are implemented and being validated; the Product Quality Index is planned. No savings figures until pilots measure them."
  problem: "The top obstacle to scaling quality and AI investments is unclear return. Leadership asks for one number, teams report story points, and savings are claimed without checking whether quality held."
  gets:
    - "A baseline first: lead time, deployment frequency, change failure rate and escaped defects, from your CI and repositories."
    - "Goals, signals and metrics proposed for review, as the KPIs you report or key results under your OKRs."
    - "Planned: a Product Quality Index with traceable inputs, approved weights and visible gaps, where leadership wants one number."
    - "A saving counts only if quality holds: guardrail metrics next to every claim."
    - "Status reports on request or every week, each statement linked to its evidence."
  questions: [measurable-quality, status, release-decision]
  related: [outcomes]
