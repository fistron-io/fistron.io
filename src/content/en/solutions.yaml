- id: migration-assurance
  title: "Migration Assurance"
  for: "For vendors whose customers move to containers or the cloud"
  group: certification
  short: "A server moving from virtual machines or bare metal to containers, Kubernetes or a cloud: what must survive recorded before, the migration rehearsed in staging, the cutover verified with a signed attestation."
  status: available
  stage: "Implemented and being validated (V7.7): the inventory of the source installation, read-only, and the required behaviour derived from it; the rehearsal in staging compared before and after; the restore of the backup proven; the cutover verified with a signed attestation; for vendors, the matrix of supported migration paths with those without evidence. Next: a real RPM-to-container migration of an open-source product, rehearsed and attested."
  problem: "Vendors support more migration paths than they test. Large customers hit the combination nobody tried, the migration fails or loses behaviour, and they stop migrating: they stay on old versions and deployment models for years. And every customer must test such a change before production anyway."
  gets:
    - "What must survive, recorded read-only from the source installation: services, configuration, the counts of what the product manages, integrations, certificates, scheduled jobs and performance."
    - "A rehearsal on a staging copy with the vendor's own migration tooling, and every difference before and after reported. Never in production."
    - "The cutover verified: the restore of the backup proven first, the same checks after, a signed attestation that the migration preserved what it had to, or the list of what it did not."
    - "For vendors: the supported paths without a test found and covered through your own tools, the paths your customers really use first; a migration that fails in the field becomes a test of that path."
  questions: [migration]
  related: [trust]
- id: resilience
  title: "Proof of recovery and resilience"
  for: "For teams that run IT services"
  group: compliance
  short: "Verified restores and recovery within the agreed time as evidence, not only a backup job that succeeded."
  status: in-development
  stage: "Planned for IT operations, with the EU DORA and ISO 22301 profiles."
  problem: "EU DORA requires testing ICT systems, backups and restoration. A successful backup job is one observation; a restore verified within the agreed time is the evidence."
  gets:
    - "The observations and recovery checks an agreed service objective requires, coordinated through your tools."
    - "Evidence that required behaviour survived an upgrade, a migration or a recovery."
    - "Gaps named, with the checks that would close them."
  questions: [service-objective]
  related: []
- id: code-review-rules
  title: "Code and MR/PR review by your team's rules"
  for: "For tech leads and architects reviewing code written by people and AI"
  group: compliance
  short: "Every pull or merge request reviewed against Google's code review practices, your own rules, or both, and you choose what the review does: the code explained, the AI review, your conventions. Tools and evidence check what they can; a model judges only the rest, and blocks only if you allow it."
  status: available
  stage: "Implemented and being validated: the review of pull and merge requests with Fistron's findings and an AI review; the review rules with Google's practices as the default pack, the language packs for Python, Go and Java, the evidence rules, the model's rules, the same rules in your coding assistant, the repository audit and repeated reviewer comments proposed as rules. Its synthetic exit is recorded; next: real pull requests of an open-source project."
  note: "The default rules follow Google's Engineering Practices documentation, published by Google under CC-BY 3.0. Fistron is not affiliated with Google."
  problem: "Coding assistants write code that runs but ignores how your team writes code: needless abstractions, a new helper where the project already has one, tests without real assertions, names nobody would choose. Reviewers spend their time writing the same comments again and again."
  gets:
    - "You choose what the review does, in any combination and in every plan: the code explained (what the change does, with its functions and methods), the AI review, and your conventions (the team's rules)."
    - "Google's engineering practices for code review as the default rules, your own rules beside them, or only yours."
    - "Each rule checked the cheapest reliable way: linters and patterns, Fistron's evidence (tests for the changed lines, weak tests, invented dependencies, unexplained changes), a model only for design and naming."
    - "One review on the pull or merge request together with the checks of AI-written code: every finding names its rule and its evidence."
    - "Findings of a model never block unless you turn it on, rule by rule."
    - "Stricter levels for AI-written changes, by policy."
    - "The same rules given to your coding assistant before it writes, and its branch reviewed before the pull request."
    - "An audit of the whole repository: how far the existing code is from your rules, and the trend."
    - "Repeated reviewer comments proposed as new team rules, confirmed by a person."
  questions: [review-rules, ai-code]
  related: [trust]
  see: [ai-written-code, become-a-developer, developer-assistant]
- id: sovereignty
  title: "Sovereignty: your data, your choice of AI"
  for: "For regulated organisations, air-gapped networks and no-AI policies"
  group: sovereignty
  short: "Choose how Fistron decides: rules only, with no AI at all, or a model you trust inside your network. Your code, logs and test data stay where your policy says."
  status: available
  stage: "Fistron Sovereign Rules — Deterministic, on-premises and air-gapped installation, a local model and outbound-only agents work today, as does a benchmark of rules, commercial and open-weight models on cases from your own runs. Every run records where its data went (each model and platform contacted, where it is and under whose law, what it was sent and what was withheld), and a policy refuses a contact outside the jurisdictions you allow, or a model of an origin you do not accept, before anything is sent. Planned: Fistron Sovereign LLM with your own adaptation (V7.6)."
  problem: "\"We use an LLM\" does not say which endpoint receives which data, in which jurisdiction. Regulated teams and air-gapped networks may not send code and logs out at all, and some organisations forbid AI, or models of certain origins, by policy."
  gets:
    - "Fistron Sovereign Rules — Deterministic: no LLM, every decision comes from rules and evidence, the same evidence gives the same verdict."
    - "Fistron Sovereign LLM — Performance (planned): Fistron's own model for quality engineering, on an open-weight base chosen by benchmark; it runs in your network, also air-gapped, and learns from repairs that passed CI and a person accepted."
    - "Fistron Sovereign LLM — Traceable (planned): the same on a base whose training data is documented, with Fistron's own training data, licences and consents documented too, for audits that ask what a model learned from."
    - "Your own adaptation (planned): trained on your data in your environment, also air-gapped, used only when it does better on your own benchmark; nothing leaves."
    - "A model receives evidence only up to the data class you allow; what it could not receive is reported as missing."
    - "Where every run's data went, in its ledger: each model and platform contacted, where it is and under whose law, what it was sent and what was withheld; and a policy you set in Settings that refuses any other jurisdiction, or a model of another origin, before anything is sent."
    - "On-premises or without internet access: the licence verified offline, no telemetry, agents that connect outbound only."
    - "All variants keep Fistron's deterministic evidence and gates; the LLM variants add model reasoning on top."
  questions: [sovereignty]
  related: []
