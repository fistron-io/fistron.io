# What each audience gets, in their own words. Shown in file order.
- id: leadership
  title: "For leadership and project managers"
  lines:
    - "Meet your quality, schedule and cost baselines, and prove it."
    - "Know where your release stands on quality, with evidence instead of status meetings."
    - "Your engineers ship more of what your customers pay for."
    - "Your people grow with every change: Fistron explains each change to its author, and shows you what your team should learn next, as a team, never a person's score. The team's view is in development."
  # the leadership counterpart of the engineers' pillar (Fistron's founder, 2026-11-11)
  pillar:
    title: "Expand and grow with Fistron. Don't cut."
    text: "Keep your engineers, give them Fistron and deliver more. Cutting people saves once; delivering more pays every year. Hire to deliver more and expand, not to catch up. You see it in what Fistron measures against your baseline: the changes delivered in the same time, the lead time and the failures."
    links:
      - { label: "QE capacity now, so your people can grow the business", href: "/solutions/without-headcount/" }
      - { label: "Measurable quality", href: "/solutions/measurable-quality/" }
- id: engineers
  title: "For engineers"
  lines:
    - "Your CI failed. Fistron tells you why."
    - "You changed one file. You don't wait for the whole suite."
    - "Flaky tests stop blocking you. Someone owns them, and they get fixed."
    - "Code review by Google's practices, your own rules, or both. In development."
  pillar:
    title: "AI that makes you a better developer, not a replaceable one."
    text: "Like fire, AI is a good servant and a bad master. Fistron makes your work faster and helps you grow: it explains, checks and proposes, and you decide. Every model's word is labelled and held to the evidence, never trusted blindly. Your code stays in human hands: reviewed by your team's rules, understood by its author, cleaner thanks to AI."
    links:
      - { label: "Become a developer", href: "/solutions/become-a-developer/" }
      - { label: "Code and MR/PR review by your team's rules", href: "/solutions/code-review-rules/" }
