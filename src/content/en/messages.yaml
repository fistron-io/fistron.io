# What each audience gets, in their own words. Shown in file order.
- id: leadership
  title: "For leadership and project managers"
  lines:
    - "Meet your quality, schedule and cost baselines, and prove it."
    - "Know where your release stands on quality, with evidence instead of status meetings."
    - "Your engineers ship more of what your customers pay for."
- id: engineers
  title: "For engineers"
  lines:
    - "Your CI failed. Fistron tells you why."
    - "You changed one file. You don't wait for the whole suite."
    - "Flaky tests stop blocking you. Someone owns them, and they get fixed."
    - "Code review by Google's practices, your own rules, or both. In development."
  pillar:
    title: "AI that makes you a better developer, not a replaceable one."
    text: "Like fire, AI is a good servant and a bad master. Your code stays in human hands: reviewed by your team's rules, understood by its author, cleaner thanks to AI."
    links:
      - { label: "Become a developer", href: "/solutions/become-a-developer/" }
      - { label: "Code and MR/PR review by your team's rules", href: "/solutions/code-review-rules/" }
