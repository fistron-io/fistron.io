<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 185"><style>.pop{animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:scale(1)}78%{transform:scale(1.22)}86%{transform:scale(.95)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.arm{animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.flap{animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(0)}to{transform:rotate(38deg)}}
.fly{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.hop{animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.speed{animation:speed .45s linear infinite}
@keyframes speed{from{transform:translateX(6px);opacity:.3}to{transform:translateX(-6px);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.sweep2{animation:sweep2 1.4s ease-in-out infinite alternate}
@keyframes sweep2{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.press{animation:press 2.4s ease-in-out infinite}
@keyframes press{0%,40%,100%{transform:translateY(0)}55%,65%{transform:translateY(16px)}}
.late{animation-delay:.25s}
.baton{animation:baton .9s ease-in-out infinite alternate}
@keyframes baton{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
.float{animation:float 2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stir{animation:stir 1.2s ease-in-out infinite alternate}
@keyframes stir{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.type{animation:type .35s ease-in-out infinite alternate}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-5deg)}}
.tick{animation:tick 3s infinite}
@keyframes tick{0%,45%{opacity:0}55%,100%{opacity:1}}
.shake{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style><ellipse cx="96" cy="172" rx="46" ry="5" fill="#24305e" opacity="0.12"/><path d="M62 116 L20 130 L28 108 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 151 L84 168 M102 151 L104 168 M76 168 H92 M98 168 H112" stroke="var(--crow-leg, #3a415a)" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="92" cy="118" r="36" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><g class="baton" style="transform-origin:104px 104px"><path d="M88 106 Q94 48 132 24 Q118 56 112 104 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 26 L164 8" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linecap="round"/><circle cx="165" cy="8" r="2.5" fill="#fff" stroke="var(--crow-outline, #1b2033)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g><path d="M108 53 L114 38 L122 51 Z" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="76" r="27" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><path d="M143 66 L174 79 L143 90 Z" fill="#4a5170" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="blink" style="transform-origin:126px 72px"><circle cx="126" cy="72" r="9" fill="#fff"/><circle cx="131" cy="72" r="4.5" fill="#1b2033"/></g><path d="M112 54 Q124 46 136 54" stroke="var(--crow-outline, #1b2033)" stroke-width="4.5" stroke-linecap="round" fill="none"/><g class="wing" style="transform-origin:104px 110px"><path d="M104 104 Q82 96 54 130 Q86 138 106 122 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><g class="float"><g fill="#3fa66b"><circle cx="168" cy="122" r="5"/><rect x="172" y="98" width="2.6" height="25"/></g><path d="M174 98 Q184 102 182 112" stroke="#3fa66b" stroke-width="2.6" fill="none"/></g><g class="float late" fill="var(--color-indigo, #24305e)" opacity="0.7"><circle cx="188" cy="80" r="4.2"/><rect x="191.2" y="60" width="2.2" height="21"/></g></svg>
