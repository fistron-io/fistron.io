rotate(15) scale(0.85)"><rect x="-6" y="-4" width="12" height="8" rx="2" fill="#c9cedb"/><path d="M-3 -2 L3 2 M3 -2 L-3 2" stroke="#8a90a6" stroke-width="1.5"/></g></svg>
