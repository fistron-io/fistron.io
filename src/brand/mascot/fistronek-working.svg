<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 185"><style>.pop{animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:scale(1)}78%{transform:scale(1.22)}86%{transform:scale(.95)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.arm{animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.flap{animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(0)}to{transform:rotate(38deg)}}
.fly{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.hop{animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.speed{animation:speed .45s linear infinite}
@keyframes speed{from{transform:translateX(6px);opacity:.3}to{transform:translateX(-6px);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.sweep2{animation:sweep2 1.4s ease-in-out infinite alternate}
@keyframes sweep2{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.press{animation:press 2.4s ease-in-out infinite}
@keyframes press{0%,40%,100%{transform:translateY(0)}55%,65%{transform:translateY(16px)}}
.late{animation-delay:.25s}
.baton{animation:baton .9s ease-in-out infinite alternate}
@keyframes baton{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
.float{animation:float 2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stir{animation:stir 1.2s ease-in-out infinite alternate}
@keyframes stir{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.type{animation:type .35s ease-in-out infinite alternate}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-5deg)}}
.tick{animation:tick 3s infinite}
@keyframes tick{0%,45%{opacity:0}55%,100%{opacity:1}}
.shake{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hammer{animation:hammer 1.2s ease-in infinite}
@keyframes hammer{0%,30%{transform:rotate(-26deg)}45%{transform:rotate(0)}52%{transform:rotate(-5deg)}60%,100%{transform:rotate(-26deg)}}
.glow{animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,35%{opacity:0}45%{opacity:1}52%{opacity:.4}60%,92%{opacity:1}100%{opacity:0}}
.slide{animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%,25%{transform:translateX(0)}50%,85%{transform:translateX(-18px)}100%{transform:translateX(0)}}
.road{animation:road .8s linear infinite}
@keyframes road{from{transform:translateX(0)}to{transform:translateX(-20px)}}
</style><ellipse cx="96" cy="172" rx="60" ry="5" fill="#24305e" opacity="0.12"/><g transform="translate(-14 0)"><path d="M62 116 L20 130 L28 108 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 151 L84 168 M102 151 L104 168 M76 168 H92 M98 168 H112" stroke="var(--crow-leg, #3a415a)" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="92" cy="118" r="36" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><path d="M108 53 L114 38 L122 51 Z" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="76" r="27" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><path d="M143 66 L174 79 L143 90 Z" fill="#4a5170" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="blink" style="transform-origin:126px 72px"><circle cx="126" cy="72" r="9" fill="#fff"/><circle cx="133" cy="77" r="4.5" fill="#1b2033"/></g><path d="M112 54 Q124 50 136 58" stroke="var(--crow-outline, #1b2033)" stroke-width="4.5" stroke-linecap="round" fill="none"/><g class="hammer" style="transform-origin:100px 112px"><path d="M94 112 Q118 96 140 88 L146 98 Q122 110 100 126 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 92 L162 124" stroke="#8a6a45" stroke-width="6" stroke-linecap="round"/><path d="M149 128.5 L156 138.5 L180 121.5 L173 111.5 Z" fill="#3a415a" stroke="var(--crow-outline, #1b2033)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g></g><rect x="142" y="138" width="30" height="30" rx="6.75" fill="none" stroke="#8a90a6" stroke-width="3" stroke-dasharray="6 5"/><path d="M148.75 153 L154.75 159" stroke="#3fa66b" stroke-width="4.2" stroke-linecap="round"/></svg>
