"1.4" fill="none" stroke="#8a90a6" stroke-width="1.2"/><rect class="tick" x="150" y="87" width="7" height="7" rx="1.6" fill="#3fa66b"/><path d="M160 90.5 H186" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><path d="M171 102 V116" stroke="var(--crow-outline, #1b2033)" stroke-width="4"/><path d="M134 116 H200 M140 116 V168 M194 116 V168" stroke="var(--crow-leg, #3a415a)" stroke-width="5" stroke-linecap="round"/></svg>
