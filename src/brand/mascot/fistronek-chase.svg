<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 185"><style>.pop{animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:scale(1)}78%{transform:scale(1.22)}86%{transform:scale(.95)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.arm{animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.flap{animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(0)}to{transform:rotate(38deg)}}
.fly{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.hop{animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.speed{animation:speed .45s linear infinite}
@keyframes speed{from{transform:translateX(6px);opacity:.3}to{transform:translateX(-6px);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.sweep2{animation:sweep2 1.4s ease-in-out infinite alternate}
@keyframes sweep2{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.press{animation:press 2.4s ease-in-out infinite}
@keyframes press{0%,40%,100%{transform:translateY(0)}55%,65%{transform:translateY(16px)}}
.late{animation-delay:.25s}
.baton{animation:baton .9s ease-in-out infinite alternate}
@keyframes baton{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
.float{animation:float 2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stir{animation:stir 1.2s ease-in-out infinite alternate}
@keyframes stir{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.type{animation:type .35s ease-in-out infinite alternate}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-5deg)}}
.tick{animation:tick 3s infinite}
@keyframes tick{0%,45%{opacity:0}55%,100%{opacity:1}}
.shake{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style><ellipse cx="150" cy="174" rx="26" ry="4" fill="#24305e" opacity="0.12"/><g class="fly"><g transform="translate(-6 8) scale(0.8) rotate(-8 100 110)"><path d="M62 116 L20 130 L28 108 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="flap" style="transform-origin:92px 104px"><path d="M86 104 Q74 50 36 44 Q56 76 70 112 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><circle cx="92" cy="118" r="36" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><path d="M108 53 L114 38 L122 51 Z" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="76" r="27" fill="#24305e" stroke="var(--crow-outline, #1b2033)" stroke-width="3"/><path d="M143 66 L174 79 L143 90 Z" fill="#4a5170" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="blink" style="transform-origin:126px 72px"><circle cx="126" cy="72" r="10.5" fill="#fff"/><circle cx="133" cy="73" r="5" fill="#1b2033"/></g><path d="M114 57 Q126 51 138 59" stroke="var(--crow-outline, #1b2033)" stroke-width="4.5" stroke-linecap="round" fill="none"/><g class="wing" style="transform-origin:104px 110px"><path d="M104 104 Q82 96 54 130 Q86 138 106 122 Z" fill="#1a2347" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g></g></g><path class="speed" d="M8 70 H38 M4 92 H30 M12 114 H38" stroke="var(--color-indigo, #24305e)" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/><g transform="translate(162 136) scale(0.7)"><g class="hop"><defs><clipPath id="hC01"><rect x="-40" y="-60" width="40" height="120"/></clipPath></defs><path d="M-10 22 L-16 38 M10 22 L18 34" stroke="var(--crow-leg, #3a415a)" stroke-width="5" stroke-linecap="round"/><path d="M-22 -14 L-16 -34 L-6 -22 L0 -38 L6 -22 L16 -34 L22 -14 Z" fill="#3fa66b"/><circle r="25" fill="#3fa66b"/><g clip-path="url(#hC01)"><path d="M-22 -14 L-16 -34 L-6 -22 L0 -38 L6 -22 L16 -34 L22 -14 Z" fill="#d64545"/><circle r="25" fill="#d64545"/></g><path d="M-22 -14 L-16 -34 L-6 -22 L0 -38 L6 -22 L16 -34 L22 -14 Z" fill="none" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round"/><circle r="25" fill="none" stroke="var(--crow-outline, #1b2033)" stroke-width="3" stroke-linejoin="round"/><circle cx="-8" cy="-4" r="7" fill="#fff"/><circle cx="-11" cy="-4" r="3.3" fill="#1b2033"/><circle cx="10" cy="-2" r="4.5" fill="#fff"/><circle cx="8" cy="-2" r="2.1" fill="#1b2033"/><path d="M-11 9 L-6 5 L-1 10 L4 5 L9 10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></svg>
